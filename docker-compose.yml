services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      TZ: UTC
    volumes:
      # db/, uploads/ and nightly backups/ all live here — one thing to back up
      - ./data:/data
    expose:
      - "8080"
    stop_grace_period: 15s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's cert store — losing it trips Let's Encrypt rate limits
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
